name: tests

# A commit is tested once, when it is pushed. Pull requests come from this repository's own branches, so the
# push has already tested their head: a pull_request trigger would run the same 20 minutes again. A push that
# changes nothing outside docs/ runs nothing (the progress file is committed many times a day). A newer push to
# the same branch cancels the run of the older one.
on:
  push:
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:   # run by hand from the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A run takes 12 to 21 minutes and one was cut at 30 while every check so far had
    # passed (2026-11-12), so the limit leaves room until the suites run as parallel jobs.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser
        # The browser itself comes from Playwright's own servers. Its system packages (on this
        # image only extra fonts are missing) come from Ubuntu's package mirrors, which are at
        # times unreachable from the runners for hours: then the suite runs on what the image
        # has, and says so. A missing library would fail the browser suite at launch, not pass.
        run: |
          pnpm exec playwright install chromium
          timeout 180 pnpm exec playwright install-deps chromium \
            || echo "::warning::Ubuntu's package mirrors could not be reached; the browser suite runs on the runner image's own libraries and fonts."
      - name: Run DSP and browser verification
        run: pnpm test:all
